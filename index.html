<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Video Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ff4e45;
        }
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #1f1f1f;
            color: #fff;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ff4e45;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #ff4e45;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e03e36;
        }
        main {
            width: 100%;
            max-width: 900px;
        }
        .player-container {
            width: 100%;
            margin-bottom: 30px;
            display: none;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video, iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            border: none;
        }
        .video-title-active {
            padding: 15px;
            font-size: 1.2rem;
            background-color: #181818;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            background-color: #2a2a2a;
        }
        .card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .card-author {
            font-size: 0.8rem;
            color: #aaa;
        }
        .status {
            text-align: center;
            margin: 20px 0;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Medya Portalı</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Video veya içerik ara..." onkeypress="handleKeyPress(event)">
            <button onclick="searchVideos()">Ara</button>
        </div>
    </header>

    <main>
        <!-- Oynatıcı Alanı -->
        <div class="player-container" id="playerContainer">
            <div id="mediaHolder"></div>
            <div class="video-title-active" id="activeTitle"></div>
        </div>

        <!-- Durum Bildirimi -->
        <div class="status" id="statusMessage">Arama yapmak için yukarıdaki kutuyu kullanın.</div>

        <!-- Arama Sonuçları -->
        <div class="grid" id="resultsGrid"></div>
    </main>

    <script>
        // Açık kaynak API endpoint (Piped Instance)
        const API_BASE = "https://pipedapi.kavin.rocks";

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                searchVideos();
            }
        }

        async function searchVideos() {
            const query = document.getElementById('searchInput').value.trim();
            const statusEl = document.getElementById('statusMessage');
            const gridEl = document.getElementById('resultsGrid');

            if (!query) return;

            statusEl.textContent = "Aranıyor...";
            gridEl.innerHTML = "";

            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}&filter=videos`);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    statusEl.textContent = "Sonuç bulunamadı.";
                    return;
                }

                statusEl.textContent = "";
                renderResults(data.items);
            } catch (err) {
                console.error(err);
                statusEl.textContent = "Arama sırasında bir hata oluştu. Lütfen tekrar deneyin.";
            }
        }

        function renderResults(items) {
            const gridEl = document.getElementById('resultsGrid');
            gridEl.innerHTML = "";

            items.forEach(item => {
                if (item.type !== 'stream') return;

                // Video ID çıkarma (/watch?v=...)
                const videoId = item.url.split('v=')[1];

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playVideo(videoId, item.title);

                card.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}" loading="lazy">
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <div class="card-author">${item.uploaderName || ''}</div>
                    </div>
                `;
                gridEl.appendChild(card);
            });
        }

        async function playVideo(videoId, title) {
            const playerContainer = document.getElementById('playerContainer');
            const mediaHolder = document.getElementById('mediaHolder');
            const activeTitle = document.getElementById('activeTitle');

            playerContainer.style.display = 'block';
            activeTitle.textContent = title;
            mediaHolder.innerHTML = "<p style='padding:20px; text-align:center;'>Yükleniyor...</p>";

            // Sayfayı player kısmına kaydır
            playerContainer.scrollIntoView({ behavior: 'smooth' });

            try {
                // Video detaylarını al ve doğrudan stream URL'sini oynat
                const res = await fetch(`${API_BASE}/streams/${videoId}`);
                const data = await res.json();

                // HLS veya mp4 formatındaki stream'i bul
                const stream = data.hls || (data.audioVideoFiles && data.audioVideoFiles[0] ? data.audioVideoFiles[0].url : null);

                if (stream) {
                    mediaHolder.innerHTML = `
                        <video controls autoplay>
                            <source src="${stream}" type="application/x-mpegURL">
                            <source src="${stream}" type="video/mp4">
                            Tarayıcınız video oynatmayı desteklemiyor.
                        </video>
                    `;
                } else {
                    // Yayın akışı doğrudan alınamazsa fallback iframe kullan
                    mediaHolder.innerHTML = `
                        <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1" allowfullscreen allow="autoplay"></iframe>
                    `;
                }
            } catch (err) {
                // Hata durumunda güvenli iframe fallback
                mediaHolder.innerHTML = `
                    <iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1" allowfullscreen allow="autoplay"></iframe>
                `;
            }
        }
    </script>
</body>
</html>
