<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTune Arama</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f1e9;
      --fg: #1a2f36;
      --primary: #e85d2c;
      --card: #faf8f4;
      --muted: #6b7c82;
      --border: #e0d9cc;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      background-image:
        linear-gradient(rgba(224,217,204,0.45) 1px, transparent 1px),
        linear-gradient(90deg, rgba(224,217,204,0.45) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
    header { text-align: center; margin-bottom: 36px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(232,93,44,0.12); color: var(--primary);
      font-size: 12px; font-weight: 600; padding: 6px 14px;
      border-radius: 999px; margin-bottom: 18px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.9rem, 5vw, 2.8rem);
      font-weight: 700; line-height: 1.15; margin-bottom: 10px;
    }
    h1 span { color: var(--primary); }
    .subtitle { color: var(--muted); font-size: 15px; line-height: 1.5; }

    .search-box {
      display: flex; max-width: 640px; margin: 32px auto 0;
      background: white; border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px -14px rgba(26,47,54,0.22);
      overflow: hidden;
      position: sticky;
      top: 10px;
      z-index: 100;
    }
    .search-wrap { position: relative; flex: 1; }
    .search-wrap::before {
      content: "🔍"; position: absolute; left: 18px; top: 50%;
      transform: translateY(-50%); font-size: 15px; opacity: 0.6;
    }
    .search-box input {
      width: 100%; border: none; outline: none;
      padding: 16px 20px 16px 48px; font-size: 15px;
      font-family: inherit; background: transparent;
    }
    .search-box button {
      background: var(--primary); color: white; border: none;
      padding: 0 26px; font-weight: 600; font-size: 15px;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .search-box button:hover { background: #d14e22; }
    .search-box button:disabled { opacity: 0.65; cursor: not-allowed; }

    .examples {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 16px;
      font-size: 13px; color: var(--muted);
    }
    .examples button {
      background: white; border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 14px; cursor: pointer;
      font-family: inherit; font-size: 13px;
    }
    .examples button:hover { border-color: var(--primary); color: var(--primary); }

    /* Sabit Oynatıcı Alanı */
    .sticky-player-container {
      position: sticky;
      top: 75px;
      z-index: 90;
      max-width: 768px;
      margin: 20px auto 0;
      display: none;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .sticky-player-container.active { display: block; }
    .player-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px; background: #faf8f4; border-bottom: 1px solid var(--border);
      gap: 8px;
    }
    .player-header strong { font-size: 14px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .player-controls { display: flex; align-items: center; gap: 8px; }
    .switch-btn {
      background: var(--primary); color: white; border: none;
      padding: 4px 10px; border-radius: 6px; font-size: 12px;
      font-weight: 600; cursor: pointer;
    }
    .switch-btn:hover { background: #d14e22; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); padding: 0 4px; }
    .player-frame { aspect-ratio: 16/9; background: #000; }
    .player-frame iframe { width: 100%; height: 100%; border: none; }

    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin: 30px 0 18px; font-size: 14px; color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
      transition: 0.25s; cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px -20px rgba(26,47,54,0.25);
    }
    .thumb {
      aspect-ratio: 16/9; background: #ddd;
      position: relative; overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
    .card:hover .thumb img { transform: scale(1.04); }
    .duration {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.8); color: white;
      font-size: 12px; padding: 2px 6px; border-radius: 4px;
    }
    .card-body { padding: 14px; }
    .card-title {
      font-weight: 600; font-size: 15px; line-height: 1.35;
      margin-bottom: 6px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta { font-size: 13px; color: var(--muted); }

    .status-box {
      text-align: center; padding: 50px 20px;
      color: var(--muted); font-size: 15px; line-height: 1.6;
    }
    .status-box.error { color: #c0392b; }
    .status-box.loading { color: var(--primary); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">● AÇIK VİDEO KEŞFİ</div>
      <h1>İzlemek istediğin<br><span>şeyi bul.</span></h1>
      <p class="subtitle">YouTube’un açık dünyasında hızlıca gezin.<br>Hesap açmadan, reklamsız ve kesintisiz.</p>
    </header>

    <div class="search-box">
      <div class="search-wrap">
        <input id="q" type="text" placeholder="Bir konu, kanal ya da video ara" autocomplete="off" />
      </div>
      <button id="btn" type="button">Ara →</button>
    </div>

    <!-- Sabit Oynatıcı Alanı -->
    <div id="playerContainer" class="sticky-player-container">
      <div class="player-header">
        <strong id="playerTitle">Video Yükleniyor...</strong>
        <div class="player-controls">
          <button type="button" id="switchServerBtn" class="switch-btn" title="Açılmazsa alternatif sunucuya geçin">🔄 Sunucu Değiştir</button>
          <button type="button" id="closePlayerBtn" class="close-btn">✕</button>
        </div>
      </div>
      <div class="player-frame">
        <iframe id="frame" allowfullscreen
          referrerpolicy="no-referrer"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>
    </div>

    <div class="examples">
      <span>ÖRNEKLER</span>
      <button type="button" data-q="istanbul yürüyüşleri">istanbul yürüyüşleri</button>
      <button type="button" data-q="Türkçe caz">Türkçe caz</button>
      <button type="button" data-q="kahve demleme">kahve demleme</button>
    </div>

    <div class="results-header">
      <span id="count">Arama yapın</span>
      <span>Açık ve güvenilir</span>
    </div>

    <div id="grid" class="grid"></div>
    <div id="status" class="status-box">Bir şeyler ara...</div>
  </div>

  <script>
    const PIPED_NODES = [
      "https://pipedapi.kavin.rocks",
      "https://api.piped.private.coffee",
      "https://pipedapi.mha.fi"
    ];

    // Cloudflare Korumasına Takılmayan Güvenilir Oynatıcı Sunucuları
    const EMBED_NODES = [
      (id) => `https://piped.video/embed/${id}?autoplay=1`,
      (id) => `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`,
      (id) => `https://yewtu.be/embed/${id}?autoplay=1`,
      (id) => `https://invidious.drgns.space/embed/${id}?autoplay=1`
    ];

    let currentVideoId = "";
    let currentServerIndex = 0;

    const qInput = document.getElementById("q");
    const btn = document.getElementById("btn");
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const countEl = document.getElementById("count");
    
    const playerContainer = document.getElementById("playerContainer");
    const playerTitle = document.getElementById("playerTitle");
    const frame = document.getElementById("frame");
    const closePlayerBtn = document.getElementById("closePlayerBtn");
    const switchServerBtn = document.getElementById("switchServerBtn");

    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDuration(sec) {
      if (!sec || sec < 0) return "";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function formatViews(views) {
      if (!views) return "";
      if (views >= 1000000) return (views / 1000000).toFixed(1) + "M izlenme";
      if (views >= 1000) return (views / 1000).toFixed(0) + "B izlenme";
      return views + " izlenme";
    }

    function setStatus(text, type) {
      statusEl.innerHTML = text;
      statusEl.className = "status-box" + (type ? " " + type : "");
      statusEl.style.display = text ? "block" : "none";
    }

    async function fetchFromPiped(query) {
      let lastError;
      for (const node of PIPED_NODES) {
        try {
          const url = `${node}/search?q=${encodeURIComponent(query)}&filter=all`;
          const res = await fetch(url);
          if (res.ok) {
            return await res.json();
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Hiçbir API sunucusuna ulaşılamadı.");
    }

    async function search() {
      const query = qInput.value.trim();
      if (query.length < 2) {
        setStatus("En az 2 karakter yaz.", "error");
        grid.innerHTML = "";
        countEl.textContent = "Arama yapın";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Aranıyor...";
      setStatus("Aranıyor, lütfen bekleyin...", "loading");
      grid.innerHTML = "";
      countEl.textContent = "Yükleniyor...";

      try {
        const data = await fetchFromPiped(query);
        const items = Array.isArray(data.items) ? data.items : [];
        
        const results = items
          .filter(v => v.type === "stream")
          .map(v => {
            const videoId = v.url ? v.url.replace("/watch?v=", "") : "";
            return {
              id: videoId,
              title: v.title,
              channel: v.uploaderName,
              views: formatViews(v.views),
              publishedAt: v.uploadedDate || "",
              duration: formatDuration(v.duration),
              thumbnail: v.thumbnail || `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`
            };
          }).filter(v => v.id);

        if (results.length === 0) {
          setStatus("Sonuç bulunamadı. Başka bir kelime dene.", "");
          countEl.textContent = "0 sonuç";
        } else {
          setStatus("", "");
          countEl.textContent = results.length + " sonuç";
          render(results);
        }
      } catch (err) {
        console.error(err);
        setStatus(
          "Arama yapılamadı.<br><small>Hata: " + esc(err.message) + "</small>",
          "error"
        );
        countEl.textContent = "Hata";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ara →";
      }
    }

    function render(list) {
      var html = "";
      for (var i = 0; i < list.length; i++) {
        var v = list[i];
        var id = esc(v.id || "");
        var title = esc(v.title || "Başlıksız");
        var channel = esc(v.channel || "");
        var views = esc(v.views || "");
        var published = esc(v.publishedAt || "");
        var duration = esc(v.duration || "");
        var thumb = esc(v.thumbnail || "https://via.placeholder.com/480x270?text=Video");
        var meta = [channel, views, published].filter(Boolean).join(" · ");

        html += '<div class="card" data-id="' + id + '" data-title="' + title + '">' +
          '<div class="thumb">' +
            '<img src="' + thumb + '" alt="" loading="lazy" onerror="this.src=\'https://via.placeholder.com/480x270?text=Video\'">' +
            (duration ? '<span class="duration">' + duration + '</span>' : '') +
          '</div>' +
          '<div class="card-body">' +
            '<div class="card-title">' + title + '</div>' +
            '<div class="card-meta">' + meta + '</div>' +
          '</div>' +
        '</div>';
      }
      grid.innerHTML = html;

      var cards = grid.querySelectorAll(".card");
      for (var j = 0; j < cards.length; j++) {
        cards[j].addEventListener("click", function () {
          play(this.getAttribute("data-id"), this.getAttribute("data-title"));
        });
      }
    }

    function loadVideoOnCurrentServer() {
      if (!currentVideoId) return;
      frame.src = EMBED_NODES[currentServerIndex](currentVideoId);
    }

    function play(id, title) {
      if (!id) return;
      currentVideoId = id;
      currentServerIndex = 0; // İlk güvenilir sunucudan başla
      
      playerTitle.textContent = title || "Video";
      loadVideoOnCurrentServer();
      
      playerContainer.classList.add("active");
      playerContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function switchServer() {
      if (!currentVideoId) return;
      currentServerIndex = (currentServerIndex + 1) % EMBED_NODES.length;
      loadVideoOnCurrentServer();
    }

    function closePlayer() {
      playerContainer.classList.remove("active");
      frame.src = "";
      currentVideoId = "";
    }

    btn.addEventListener("click", search);
    qInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") search();
    });
    
    closePlayerBtn.addEventListener("click", closePlayer);
    switchServerBtn.addEventListener("click", switchServer);

    var exampleBtns = document.querySelectorAll(".examples button[data-q]");
    for (var k = 0; k < exampleBtns.length; k++) {
      exampleBtns[k].addEventListener("click", function () {
        qInput.value = this.getAttribute("data-q");
        search();
      });
    }
  </script>
</body>
</html>
